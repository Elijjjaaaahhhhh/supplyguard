[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.1.0"
description = "Predictive supply-chain control tower for inventory and procurement decision support."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "psycopg[binary]",
    "python-dotenv",
    "sqlalchemy",
    "matplotlib",
    "scikit-learn",
    "joblib",
    "threadpoolctl",
]
[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
supplyguard-pipeline = "supplyguard.pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: PostgreSQL tests; require SUPPLYGUARD_DB_TESTS=1"]
