[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.1.0"
description = "Predictive supply-chain control tower for inventory and procurement decision support."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas",
    "pyarrow",
]
